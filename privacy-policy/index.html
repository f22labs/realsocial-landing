<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- GitHub Pages serves static files only, so the /privacy-policy -> /privacy
       redirect from vercel.json is reproduced here as a meta refresh.
       Note this is a client-side hop, not a 301. -->
  <meta http-equiv="refresh" content="0; url=../privacy/">
  <link rel="canonical" href="https://realsocial.me/privacy">
  <meta name="robots" content="noindex">
  <title>Redirecting to the privacy policy</title>
</head>
<body>
  <p>Redirecting to the <a href="../privacy/">privacy policy</a>.</p>
  <script>location.replace("../privacy/");</script>
</body>
</html>
