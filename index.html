<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="RS-Fav.png" sizes="92x92" type="image/png">
  <link rel="apple-touch-icon" href="RS-Fav.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&family=Arimo:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <title>Real Social App</title>
  <meta name="description" content="Real Social App is coming soon.">
</head>
<body class="park">
  <header class="site-header"><a class="lockup" href="./" aria-label="RealSocial home"><img class="logo" src="RS-Logo-Pink.png" width="824" height="199" alt="RealSocial"></a></header>
  <main>
    <h1>Your Socials,<em>AI Managed</em></h1>
    <p class="tagline">Real Social App is coming soon.</p>
    <section class="waitlist" aria-labelledby="waitlist-title">
      <h2 id="waitlist-title">Join the waitlist</h2>
      <form id="waitlist-form" novalidate>
        <div class="field">
          <label for="name">Full name</label>
          <input id="name" name="name" type="text" autocomplete="name" required maxlength="200" aria-describedby="name-error">
          <p class="error" id="name-error"></p>
        </div>
        <div class="field">
          <label for="city">City</label>
          <input id="city" name="city" type="text" autocomplete="address-level2" required maxlength="200" aria-describedby="city-error">
          <p class="error" id="city-error"></p>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required maxlength="200" aria-describedby="email-error">
          <p class="error" id="email-error"></p>
        </div>
        <div class="hp" aria-hidden="true">
          <label for="website">Website</label>
          <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
        </div>
        <button type="submit"><span class="label">Join the Waitlist</span><span class="spinner" aria-hidden="true"></span></button>
        <p class="form-status" id="waitlist-status" role="alert"></p>
        <p class="consent">By joining, you agree to receive updates about RealSocial. <a href="privacy/">Privacy Policy</a></p>
      </form>
      <p class="success" id="waitlist-success" role="status" tabindex="-1" hidden>You’re on the list. We’ll be in touch soon.</p>
    </section>
  </main>
  <footer class="site-footer">
    <span>&copy; 2026 Real Social Ventures, LLC</span>
    <nav class="footer-links">
      <a href="terms/">Terms</a>
      <a href="privacy/">Privacy Policy</a>
      <a href="data-deletion/">Delete your data</a>
    </nav>
  </footer>
  <script src="waitlist.js" defer></script>
</body>
</html>
